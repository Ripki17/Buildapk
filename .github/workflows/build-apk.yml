name: Build APK Pro

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type (git_url or zip_url)'
        required: true
        default: 'zip_url'
      source_url:
        description: 'Source URL'
        required: true
        default: ''
      branch:
        description: 'Branch'
        required: false
        default: 'main'
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'release'
      chat_id:
        description: 'Telegram chat ID'
        required: false
        default: ''
      status_message_id:
        description: 'Telegram status message ID'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter version'
        required: false
        default: 'stable'
      release_tag:
        description: 'Release tag'
        required: false
        default: ''

concurrency:
  group: apk-build-${{ github.event.inputs.chat_id }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Setup Build Info
        run: |
          echo "=========================================="
          echo "WEB2APK PRO BUILDER - GITHUB ACTIONS"
          echo "=========================================="
          echo "Source Type : ${{ github.event.inputs.source_type }}"
          echo "Source URL  : ${{ github.event.inputs.source_url }}"
          echo "Branch      : ${{ github.event.inputs.branch }}"
          echo "Build Type  : ${{ github.event.inputs.build_type }}"
          echo "Flutter     : ${{ github.event.inputs.flutter_version }}"
          echo "Chat ID     : ${{ github.event.inputs.chat_id }}"
          echo "Run ID      : ${{ github.run_id }}"
          echo "Actor       : ${{ github.actor }}"
          echo "Started     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          echo "START_TIME_EPOCH=$(date +%s)" >> $GITHUB_ENV

      - name: Download and Extract Project
        run: |
          echo "STEP 1: DOWNLOAD AND EXTRACT"
          mkdir -p project
          cd project
          SOURCE_TYPE="${{ github.event.inputs.source_type }}"
          SOURCE_URL="${{ github.event.inputs.source_url }}"

          if [ "$SOURCE_TYPE" = "zip_url" ]; then
            echo "Downloading ZIP: $SOURCE_URL"
            curl -L -s -S --connect-timeout 30 --retry 3 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "$SOURCE_URL" -o project.zip

            FILE_HEAD=$(head -c 15 project.zip || echo "")
            if echo "$FILE_HEAD" | grep -qiE "<!doctype|<html|<error"; then
              echo "ERROR: Downloaded content is not a ZIP file"
              head -n 20 project.zip
              exit 1
            fi

            echo "Extracting..."
            unzip -q project.zip 2>/dev/null || 7z x project.zip -y 2>/dev/null || tar -xf project.zip 2>/dev/null || true
            rm -f project.zip

            SUBDIRS=(*/)
            if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ] && [ ! -f "pubspec.yaml" ] && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              echo "Flattening: ${SUBDIRS[0]}"
              mv ${SUBDIRS[0]}* . 2>/dev/null || true
              mv ${SUBDIRS[0]}.* . 2>/dev/null || true
              rmdir "${SUBDIRS[0]}" 2>/dev/null || true
            fi
          else
            echo "Cloning: $SOURCE_URL"
            git clone --depth 1 -b ${{ github.event.inputs.branch }} "$SOURCE_URL" .
          fi

          echo "OK: Extracted"
          ls -la | head -15

      - name: Detect Framework
        working-directory: project
        run: |
          echo "STEP 2: DETECT FRAMEWORK"
          if [ -f "pubspec.yaml" ]; then
            echo "FRAMEWORK=flutter" >> $GITHUB_ENV
            echo "Detected: FLUTTER"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -d "app" ]; then
            echo "FRAMEWORK=native-android" >> $GITHUB_ENV
            echo "Detected: NATIVE ANDROID"
          else
            echo "FRAMEWORK=unknown" >> $GITHUB_ENV
            echo "ERROR: Framework not detected"
            exit 1
          fi

      - name: Setup JDK 17 and 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            11

      - name: Setup Android SDK 36
        run: |
          echo "STEP 3: SETUP ANDROID SDK"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "SDK 36 installed"

      - name: Pre-Build Environment Patching
        working-directory: project
        run: |
          echo "STEP 4: PRE-BUILD PATCHING"
          if [ -d "android" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          GRADLE_PROP="android/gradle.properties"
          if [ ! -d "android" ]; then
            GRADLE_PROP="gradle.properties"
          fi

          touch "$GRADLE_PROP"
          grep -q "org.gradle.jvmargs" "$GRADLE_PROP" || echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> "$GRADLE_PROP"
          grep -q "android.useAndroidX" "$GRADLE_PROP" || echo "android.useAndroidX=true" >> "$GRADLE_PROP"
          grep -q "android.enableJetifier" "$GRADLE_PROP" || echo "android.enableJetifier=true" >> "$GRADLE_PROP"
          grep -q "android.newDsl" "$GRADLE_PROP" || echo "android.newDsl=false" >> "$GRADLE_PROP"

          [ -f "./gradlew" ] && chmod +x ./gradlew
          [ -f "android/gradlew" ] && chmod +x android/gradlew
          echo "Patching done"

      - name: Setup Flutter
        if: env.FRAMEWORK == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_version || 'stable' }}
          cache: true

      - name: Show Flutter Version
        if: env.FRAMEWORK == 'flutter'
        run: flutter --version

      - name: Auto-Patch Compatibility Fixes
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          echo "STEP 5: AUTO-PATCH COMPATIBILITY"
          if [ ! -d "lib" ]; then
            echo "No lib folder, skipping"
            exit 0
          fi

          # Patch 1: file_picker v13
          B1=$(grep -rn "allowMultiple\|withData\|FilePicker\.platform\|withReadStream" lib/ 2>/dev/null | wc -l)
          echo "file_picker issues before: $B1"
          find lib -name "*.dart" -type f -exec sed -i -E \
            -e 's/FilePicker\.platform/FilePicker/g' \
            -e '/^[[:space:]]*allowMultiple[[:space:]]*:/d' \
            -e '/^[[:space:]]*withData[[:space:]]*:/d' \
            -e '/^[[:space:]]*withReadStream[[:space:]]*:/d' \
            -e '/^[[:space:]]*allowCompression[[:space:]]*:/d' \
            -e '/^[[:space:]]*compressionQuality[[:space:]]*:/d' \
            {} \;
          A1=$(grep -rn "allowMultiple\|withData\|FilePicker\.platform" lib/ 2>/dev/null | wc -l)
          echo "file_picker issues after: $A1"

          # Patch 2: firebase_database v12
          B2=$(grep -rnE "\bmutableData\.value" lib/ 2>/dev/null | wc -l)
          echo "mutableData issues before: $B2"
          find lib -name "*.dart" -type f -exec sed -i -E \
            's/\bmutableData\.value/(mutableData as MutableData).value/g' {} \;
          for f in $(grep -rl "MutableData" lib/ 2>/dev/null); do
            grep -q "import 'package:firebase_database/firebase_database.dart'" "$f" || \
              sed -i "1i import 'package:firebase_database/firebase_database.dart';" "$f"
          done
          A2=$(grep -rnE "\bmutableData\.value" lib/ 2>/dev/null | grep -v "(mutableData as MutableData)" | wc -l)
          echo "mutableData issues after: $A2"

          # Patch 3: font_awesome v11
          B3=$(grep -rn "Icon(FontAwesomeIcons\." lib/ 2>/dev/null | wc -l)
          echo "font_awesome issues before: $B3"
          find lib -name "*.dart" -type f -exec sed -i -E \
            's/(\bconst\s+)?Icon\(FontAwesomeIcons\./\1FaIcon(FontAwesomeIcons./g' {} \;
          for f in $(grep -rl "FontAwesomeIcons" lib/ 2>/dev/null); do
            sed -i -E 's/\bIconData\?/FaIconData?/g; s/\bIconData\b/FaIconData/g' "$f"
          done
          A3=$(grep -rn "Icon(FontAwesomeIcons\." lib/ 2>/dev/null | wc -l)
          echo "font_awesome issues after: $A3"

          # Patch 4: file_picker result access
          find lib -name "*.dart" -type f -exec sed -i -E \
            -e 's/picked!\.files\.first/picked!.first/g' \
            -e 's/picked\.files\.first/picked.first/g' \
            -e 's/picked!\.files\.single/picked!.first/g' \
            -e 's/picked\.files\.single/picked.first/g' \
            -e 's/picked!\.files\.isEmpty/picked!.isEmpty/g' \
            -e 's/picked\.files\.isEmpty/picked.isEmpty/g' \
            -e 's/picked!\.files\.length/picked!.length/g' \
            -e 's/picked\.files\.length/picked.length/g' \
            {} \;

          # Patch 5: file_picker file.bytes
          find lib -name "*.dart" -type f -exec sed -i -E \
            's/file\.bytes[[:space:]]*\?\?[[:space:]]*\(file\.path[[:space:]]*==[[:space:]]*null[[:space:]]*\?[[:space:]]*null[[:space:]]*:[[:space:]]*await[[:space:]]+File\(file\.path!\)\.readAsBytes\(\)\)/await File(file.path!).readAsBytes()/g' {} \;
          find lib -name "*.dart" -type f -exec sed -i -E \
            's/file\.bytes[[:space:]]*\?\?[[:space:]]*await[[:space:]]+File\(file\.path!\)\.readAsBytes\(\)/await File(file.path!).readAsBytes()/g' {} \;

          # Patch 6: pubspec upgrades
          if [ -f "pubspec.yaml" ]; then
            grep -qE "font_awesome_flutter:" pubspec.yaml && \
              sed -i -E 's/font_awesome_flutter:[[:space:]]*.*/font_awesome_flutter: ^11.0.0/g' pubspec.yaml
          fi

          echo "=========================================="
          echo "PATCH SUMMARY"
          echo "file_picker: $B1 -> $A1"
          echo "mutableData: $B2 -> $A2"
          echo "font_awesome: $B3 -> $A3"
          echo "=========================================="

      - name: Pre-Fix Gradle and SDK
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          echo "STEP 6: PRE-FIX GRADLE"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.14-all.zip|g' "$WRAPPER"
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.14-bin.zip|g' "$WRAPPER"
          else
            mkdir -p android/gradle/wrapper
            printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip\nnetworkTimeout=10000\nvalidateDistributionUrl=true\n' > "$WRAPPER"
          fi

          APP_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_KTS" ]; then
            sed -i 's/compileSdk *= *[0-9]*/compileSdk = 36/g' "$APP_KTS" || true
            sed -i 's/targetSdk *= *[0-9]*/targetSdk = 36/g' "$APP_KTS" || true
            sed -i 's/minSdk *= *[0-9]*/minSdk = 21/g' "$APP_KTS" || true
          fi

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' "$APP_GRADLE" || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' "$APP_GRADLE" || true
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' "$APP_GRADLE" || true
          fi

          rm -rf build android/build android/app/build android/.gradle .gradle pubspec.lock .dart_tool || true
          echo "Gradle fixes applied"

      - name: Build Flutter APK
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          echo "STEP 7: BUILD FLUTTER APK"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          flutter clean || true
          flutter pub get 2>&1 | tee pubget.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "pub get failed, retrying..."
            rm -f pubspec.lock
            flutter pub cache repair || true
            flutter pub get 2>&1 | tee pubget_retry.log
          fi

          BUILD_FLAG="--release"
          [ "${{ github.event.inputs.build_type }}" = "debug" ] && BUILD_FLAG="--debug"

          echo "Building APK ($BUILD_FLAG)..."
          set +e
          flutter build apk $BUILD_FLAG --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo "Build exit code: $BUILD_EXIT"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=========================================="
            echo "BUILD FAILED - ERROR LOG"
            echo "=========================================="
            tail -80 build_output.log
            exit 1
          fi

          echo "BUILD SUCCESSFUL"

      - name: Build Native Android APK
        if: env.FRAMEWORK == 'native-android'
        working-directory: project
        run: |
          echo "STEP 7: BUILD NATIVE ANDROID APK"
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_URL=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties || echo "")
            if echo "$GRADLE_URL" | grep -qE "gradle-([456]\.|7\.[0-2])"; then
              export JAVA_HOME="$JAVA_HOME_11_X64"
            else
              export JAVA_HOME="$JAVA_HOME_17_X64"
            fi
          else
            export JAVA_HOME="$JAVA_HOME_17_X64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          [ ! -f "./gradlew" ] && { gradle wrapper || true; chmod +x ./gradlew || true; }

          BUILD_CMD="./gradlew assembleRelease --no-daemon --stacktrace"
          [ "${{ github.event.inputs.build_type }}" = "debug" ] && BUILD_CMD="./gradlew assembleDebug --no-daemon --stacktrace"

          set +e
          $BUILD_CMD 2>&1 | tee build_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "BUILD FAILED"
            cat build_output.log
            exit 1
          fi
          echo "BUILD SUCCESSFUL"

      - name: AI Error Analyzer
        if: failure()
        run: |
          echo "STEP 8: AI ERROR ANALYZER"
          if [ ! -f "project/build_output.log" ]; then
            echo "No build log to analyze"
            exit 0
          fi

          ERROR_TEXT=$(grep -E "Error:|error:|FAILURE|Exception|Could not|BUILD FAILED|Undefined|Missing|No such|Cannot" project/build_output.log | head -25)
          ERROR_TAIL=$(tail -20 project/build_output.log)
          ERROR_FULL="$ERROR_TEXT

Last lines:
$ERROR_TAIL"

          ERROR_FULL=$(echo "$ERROR_FULL" | head -c 1800)

          PAYLOAD=$(jq -n --arg text "Flutter build failed with error:

$ERROR_FULL

Provide analysis in Indonesian:
1. AKAR MASALAH (1 sentence)
2. SOLUSI CEPAT (3-5 actionable points)
3. PENCEGAHAN (1 sentence)

Keep it brief and practical." '{text: $text}')

          echo "Sending to Claude AI..."
          RESPONSE=""
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."
            RESPONSE=$(curl -s --max-time 60 \
              -X POST "https://api-faa.my.id/faa/claude-ai" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" 2>&1) || true

            if [ -n "$RESPONSE" ] && [ "$RESPONSE" != "null" ] && [ "$RESPONSE" != "{}" ]; then
              echo "Response received"
              break
            fi
            echo "Empty response, retrying..."
            sleep 3
          done

          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then
            echo "AI unavailable"
            exit 0
          fi

          AI_TEXT=""
          if command -v jq >/dev/null 2>&1; then
            AI_TEXT=$(echo "$RESPONSE" | jq -r '.response // .message // .result // .text // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$AI_TEXT" ] || [ "$AI_TEXT" = "null" ]; then
            AI_TEXT="$RESPONSE"
          fi

          echo "=========================================="
          echo "AI ANALYSIS"
          echo "=========================================="
          echo "$AI_TEXT"
          echo "=========================================="

          {
            echo "=========================================="
            echo "AI ERROR ANALYSIS"
            echo "Generated: $(date -u)"
            echo "Run ID: ${{ github.run_id }}"
            echo "=========================================="
            echo ""
            echo "--- ERROR CONTEXT ---"
            echo "$ERROR_FULL"
            echo ""
            echo "--- AI ANALYSIS ---"
            echo "$AI_TEXT"
          } > /tmp/ai_analysis.txt

          {
            echo ""
            echo "---"
            echo ""
            echo "## AI Error Analysis"
            echo ""
            echo "> AI suggestion - verify before applying"
            echo ""
            echo "$AI_TEXT"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Logs and AI Analysis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            project/build_output.log
            project/pubget.log
            project/pubget_retry.log
            /tmp/ai_analysis.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Find APK
        if: success()
        id: find_apk
        run: |
          echo "STEP 9: FIND APK"
          find project -type f -name "*.apk" 2>/dev/null | head -10 || echo "No APK found"

          APK_FILE=$(find project -type f -name "*.apk" | grep -v "androidTest" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            tail -50 project/build_output.log 2>/dev/null || true
            exit 1
          fi

          APK_FILE=$(echo "$APK_FILE" | sed 's|^\./||')
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA=$(sha256sum "$APK_FILE" | cut -d ' ' -f1)

          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $APK_FILE)" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "APK_SHA=$APK_SHA" >> $GITHUB_ENV

          echo "Name: $(basename $APK_FILE)"
          echo "Size: $APK_SIZE"
          echo "Path: $APK_FILE"
          echo "SHA-256: $APK_SHA"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-output
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: Telegram Notification
        if: always()
        run: |
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"

          if [ -z "$CHAT_ID" ] || [ -z "$BOT_TOKEN" ]; then
            echo "Skipping Telegram (missing CHAT_ID or BOT_TOKEN)"
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            TEXT="BUILD SUCCESS%0A%0AFile: ${{ env.APK_NAME }}%0ASize: ${{ env.APK_SIZE }}%0A%0AAPK akan dikirim bot segera..."
          else
            TEXT="BUILD FAILED%0A%0ACek AI analysis di:%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$TEXT" \
            -d "disable_web_page_preview=true" || true

      - name: Final Summary
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME_EPOCH))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))

          echo ""
          echo "=========================================="
          if [ "${{ job.status }}" = "success" ]; then
            echo "BUILD SUCCESSFUL"
            echo "=========================================="
            echo "File: ${{ env.APK_NAME }}"
            echo "Size: ${{ env.APK_SIZE }}"
            echo "SHA-256: ${{ env.APK_SHA }}"
            echo "Duration: ${MIN}m ${SEC}s"
          else
            echo "BUILD FAILED"
            echo "=========================================="
            echo "Duration: ${MIN}m ${SEC}s"
            echo "Check AI analysis above"
          fi
          echo "=========================================="

      - name: GitHub Job Summary
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME_EPOCH))
          MIN=$((DURATION / 60))
          SEC=$((DURATION % 60))

          if [ "${{ job.status }}" = "success" ]; then
            echo "# Build Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## APK Information" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| File | \`${{ env.APK_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Size | \`${{ env.APK_SIZE }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| SHA-256 | \`${{ env.APK_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Duration | \`${MIN}m ${SEC}s\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Auto-Patches (6 categories)" >> $GITHUB_STEP_SUMMARY
            echo "- file_picker v13 (platform, allowMultiple, withData)" >> $GITHUB_STEP_SUMMARY
            echo "- firebase_database v12 (MutableData cast)" >> $GITHUB_STEP_SUMMARY
            echo "- font_awesome_flutter v11 (Icon to FaIcon)" >> $GITHUB_STEP_SUMMARY
            echo "- file_picker result access" >> $GITHUB_STEP_SUMMARY
            echo "- file_picker file.bytes" >> $GITHUB_STEP_SUMMARY
            echo "- pubspec upgrades" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Download" >> $GITHUB_STEP_SUMMARY
            echo "Scroll to Artifacts, download \`apk-build-output\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "# Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Duration | \`${MIN}m ${SEC}s\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Source | \`${{ github.event.inputs.source_type }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download \`build-failure-log\` artifact for full logs." >> $GITHUB_STEP_SUMMARY
          fi