name: Build Native Android & Flutter APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type: git_url or zip_url'
        required: true
        default: 'git_url'
      source_url:
        description: 'Target Git URL or Telegram Direct ZIP Download URL'
        required: true
        default: 'https://github.com/android/architecture-samples'
      branch:
        description: 'Branch or Tag (if git_url)'
        required: false
        default: 'main'
      build_type:
        description: 'Build variant (debug or release)'
        required: true
        default: 'release'
      chat_id:
        description: 'Telegram Chat ID (optional)'
        required: false
        default: ''
      status_message_id:
        description: 'Telegram Message ID (optional)'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter version'
        required: false
        default: 'stable'
      release_tag:
        description: 'Release tag'
        required: false
        default: ''

jobs:
  build:
    name: Auto-Repair & Compile APK Engine
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ═══════════════════════════════════════════════════════════
      # STEP 1: DOWNLOAD & EXTRACT PROJECT
      # ═══════════════════════════════════════════════════════════
      - name: Setup Workspace & Extract Project
        run: |
          mkdir -p project
          cd project
          SOURCE_TYPE="${{ github.event.inputs.source_type }}"
          SOURCE_URL="${{ github.event.inputs.source_url }}"

          if [ "$SOURCE_TYPE" = "zip_url" ]; then
            echo "📥 Mengunduh Project Archive dari: $SOURCE_URL"
            curl -L -s -S --connect-timeout 30 --retry 3 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "$SOURCE_URL" -o project.zip

            FILE_HEAD=$(head -c 15 project.zip || echo "")
            if echo "$FILE_HEAD" | grep -qiE "<!doctype|<html|<error"; then
              echo "❌ ERROR: URL yang diunduh bukan file ZIP!"
              head -n 20 project.zip
              exit 1
            fi

            echo "📦 Mengekstrak..."
            unzip -q project.zip || 7z x project.zip || tar -xf project.zip || true
            rm -f project.zip

            SUBDIRS=(*/)
            if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ] && [ ! -f "pubspec.yaml" ] && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              echo "🔄 Flattening: ${SUBDIRS[0]}"
              mv ${SUBDIRS[0]}* . 2>/dev/null || true
              mv ${SUBDIRS[0]}.* . 2>/dev/null || true
            fi
          else
            echo "📥 Cloning: $SOURCE_URL"
            git clone --depth 1 -b ${{ github.event.inputs.branch }} "$SOURCE_URL" .
          fi
          ls -la

      # ═══════════════════════════════════════════════════════════
      # STEP 2: DETECT FRAMEWORK
      # ═══════════════════════════════════════════════════════════
      - name: Detect Framework
        id: detect
        working-directory: project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "FRAMEWORK=flutter" >> $GITHUB_ENV
            echo "✅ Flutter"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -d "app" ]; then
            echo "FRAMEWORK=native-android" >> $GITHUB_ENV
            echo "✅ Native Android"
          else
            echo "FRAMEWORK=unknown" >> $GITHUB_ENV
            exit 1
          fi

      # ═══════════════════════════════════════════════════════════
      # STEP 3: SETUP JDK
      # ═══════════════════════════════════════════════════════════
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ═══════════════════════════════════════════════════════════
      # STEP 4: PRE-BUILD FIX
      # ═══════════════════════════════════════════════════════════
      - name: Pre-Build Auto-Repair
        working-directory: project
        run: |
          echo "🛠 Pre-Build Self-Repair..."
          if [ -d "android" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          GRADLE_PROP="android/gradle.properties"
          if [ ! -d "android" ]; then
            GRADLE_PROP="gradle.properties"
          fi

          touch "$GRADLE_PROP"
          grep -q "org.gradle.jvmargs" "$GRADLE_PROP" || echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> "$GRADLE_PROP"
          grep -q "android.useAndroidX" "$GRADLE_PROP" || echo "android.useAndroidX=true" >> "$GRADLE_PROP"
          grep -q "android.enableJetifier" "$GRADLE_PROP" || echo "android.enableJetifier=true" >> "$GRADLE_PROP"
          grep -q "android.newDsl" "$GRADLE_PROP" || echo "android.newDsl=false" >> "$GRADLE_PROP"

          [ -f "./gradlew" ] && chmod +x ./gradlew
          [ -f "android/gradlew" ] && chmod +x android/gradlew
          echo "✅ Pre-Build Done"

      # ═══════════════════════════════════════════════════════════
      # STEP 5: SETUP FLUTTER
      # ═══════════════════════════════════════════════════════════
      - name: Setup Flutter
        if: env.FRAMEWORK == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_version || 'stable' }}
          cache: true

      # ═══════════════════════════════════════════════════════════
      # STEP 6: FIX GRADLE VERSION (FIX UTAMA)
      # ═══════════════════════════════════════════════════════════
      - name: Pre-Fix Gradle Version
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          echo "🔧 Upgrade Gradle wrapper ke 8.14.0..."
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            echo "=== SEBELUM ==="
            cat "$WRAPPER"
            sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.14-all.zip|g' "$WRAPPER"
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.14-bin.zip|g' "$WRAPPER"
            echo "=== SESUDAH ==="
            cat "$WRAPPER"
          else
            echo "⚠️ Wrapper tidak ada, buat baru..."
            mkdir -p android/gradle/wrapper
            cat > "$WRAPPER" <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
networkTimeout=10000
validateDistributionUrl=true
EOF
          fi

          echo "🔧 Patch build.gradle.kts (Kotlin DSL)..."
          APP_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_KTS" ]; then
            sed -i 's/compileSdk *= *[0-9]*/compileSdk = 35/g' "$APP_KTS" || true
            sed -i 's/targetSdk *= *[0-9]*/targetSdk = 35/g' "$APP_KTS" || true
            sed -i 's/minSdk *= *[0-9]*/minSdk = 21/g' "$APP_KTS" || true
          fi

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' "$APP_GRADLE" || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' "$APP_GRADLE" || true
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' "$APP_GRADLE" || true
          fi

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "🧹 Clean previous build..."
          rm -rf build android/build android/app/build android/.gradle .gradle || true

          echo "✅ Pre-fix done!"

      # ═══════════════════════════════════════════════════════════
      # STEP 7: BUILD FLUTTER APK
      # ═══════════════════════════════════════════════════════════
      - name: Build Flutter APK
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "⚡ [Flutter] Step 1: Resolving dependencies..."
          flutter pub get || {
            echo "⚠️ pub get gagal, coba auto-fix..."
            rm -f pubspec.lock
            flutter clean || true
            flutter pub get --no-example || flutter pub upgrade --major-versions
          }

          BUILD_FLAG="--release"
          [ "${{ github.event.inputs.build_type }}" = "debug" ] && BUILD_FLAG="--debug"

          echo "💻 [Flutter] Step 2: Building APK ($BUILD_FLAG)..."
          set +e
          flutter build apk $BUILD_FLAG --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "⚠️ Build gagal, mencoba auto-repair..."

            if grep -qE "Could not initialize class org.codehaus.groovy|Unsupported class file" build_output.log; then
              echo "🔧 [Fix 1] Beralih ke JDK 11..."
              export JAVA_HOME="$JAVA_HOME_11_X64"
              export PATH="$JAVA_HOME/bin:$PATH"
            fi

            if grep -qE "Gradle version.*lower than|minimum supported version" build_output.log; then
              echo "🔧 [Fix 2] Force upgrade Gradle ke 8.14..."
              sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.14-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
              sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.14-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            fi

            if grep -qE "compileSdkVersion|Namespace not specified|compileSdk" build_output.log; then
              echo "🔧 [Fix 3] Force compileSdk 35 & namespace..."
              sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true
              sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true
              sed -i 's/compileSdk *= *[0-9]*/compileSdk = 35/g' android/app/build.gradle.kts 2>/dev/null || true
              sed -i 's/targetSdk *= *[0-9]*/targetSdk = 35/g' android/app/build.gradle.kts 2>/dev/null || true
            fi

            if grep -qE "Could not find|Could not resolve" build_output.log; then
              echo "🔧 [Fix 4] Menambahkan repository..."
              sed -i '/repositories {/a \        google()\n        mavenCentral()\n        maven { url "https://jitpack.io" }' android/build.gradle 2>/dev/null || true
            fi

            echo "🚀 [Retry] Coba build ulang..."
            set +e
            flutter build apk $BUILD_FLAG --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_output_retry.log
            RETRY_EXIT=${PIPESTATUS[0]}
            set -e

            if [ $RETRY_EXIT -ne 0 ]; then
              echo ""
              echo "════════════════════════════════════════"
              echo "❌ FLUTTER BUILD GAGAL TOTAL"
              echo "════════════════════════════════════════"
              echo ""
              echo "=== 50 baris terakhir dari build_output.log ==="
              tail -50 build_output.log
              echo ""
              echo "=== 50 baris terakhir dari retry ==="
              tail -50 build_output_retry.log
              echo ""
              echo "=== What went wrong ==="
              grep -A 20 "What went wrong" build_output_retry.log || true
              echo ""
              echo "=== Error lines ==="
              grep -E "FAILURE|error:|Error:|Could not|Namespace|compileSdk|BUILD FAILED|Gradle version|Exception" build_output_retry.log | head -40 || true
              exit 1
            fi
          fi

          echo "✅ Flutter build sukses!"

      # ═══════════════════════════════════════════════════════════
      # STEP 8: BUILD NATIVE ANDROID
      # ═══════════════════════════════════════════════════════════
      - name: Build Native Android APK
        if: env.FRAMEWORK == 'native-android'
        working-directory: project
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_URL=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties || echo "")
            if echo "$GRADLE_URL" | grep -qE "gradle-([456]\.|7\.[0-2])"; then
              export JAVA_HOME="$JAVA_HOME_11_X64"
            else
              export JAVA_HOME="$JAVA_HOME_17_X64"
            fi
          else
            export JAVA_HOME="$JAVA_HOME_17_X64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          [ ! -f "./gradlew" ] && { gradle wrapper || true; chmod +x ./gradlew || true; }

          BUILD_CMD="./gradlew assembleRelease --no-daemon --stacktrace"
          [ "${{ github.event.inputs.build_type }}" = "debug" ] && BUILD_CMD="./gradlew assembleDebug --no-daemon --stacktrace"

          set +e
          $BUILD_CMD 2>&1 | tee build_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "⚠️ Gradle build gagal, coba repair..."
            if grep -q "Could not initialize class org.codehaus.groovy" build_output.log; then
              export JAVA_HOME="$JAVA_HOME_11_X64"
              export PATH="$JAVA_HOME/bin:$PATH"
            fi
            if grep -q "Namespace not specified" build_output.log; then
              sed -i '/android {/a \    namespace "com.telebuild.repaired.app"' app/build.gradle 2>/dev/null || true
            fi
            if grep -q "Could not resolve all files" build_output.log; then
              sed -i '/repositories {/a \        google()\n        mavenCentral()\n        maven { url "https://jitpack.io" }' build.gradle 2>/dev/null || true
            fi
            set +e
            $BUILD_CMD 2>&1 | tee build_output_retry.log
            RETRY_EXIT=${PIPESTATUS[0]}
            set -e
            if [ $RETRY_EXIT -ne 0 ]; then
              echo "❌ Gradle build gagal total"
              tail -50 build_output_retry.log
              grep -A 20 "What went wrong" build_output_retry.log || true
              exit 1
            fi
          fi

      # ═══════════════════════════════════════════════════════════
      # STEP 9: UPLOAD LOG — SELALU (kalau gagal)
      # ═══════════════════════════════════════════════════════════
      - name: Upload Build Logs (Always on Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            project/build_output.log
            project/build_output_retry.log
          retention-days: 7
          if-no-files-found: ignore

      # ═══════════════════════════════════════════════════════════
      # STEP 10: PRINT ERROR SUMMARY (ke log Actions)
      # ═══════════════════════════════════════════════════════════
      - name: Print Error Summary
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║         ❌ BUILD GAGAL — ERROR SUMMARY                 ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          if [ -f "project/build_output.log" ]; then
            echo "━━━ Last 30 lines: build_output.log ━━━"
            tail -30 project/build_output.log
            echo ""
            echo "━━━ Error keywords ━━━"
            grep -E "FAILURE|error:|Error:|Could not|Namespace|compileSdk|BUILD FAILED|Gradle version|Exception" project/build_output.log | head -20 || true
          fi
          if [ -f "project/build_output_retry.log" ]; then
            echo ""
            echo "━━━ Last 30 lines: build_output_retry.log ━━━"
            tail -30 project/build_output_retry.log
            echo ""
            echo "━━━ What went wrong ━━━"
            grep -A 15 "What went wrong" project/build_output_retry.log || true
          fi
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║       📥 Download full log dari tab 'Artifacts'         ║"
          echo "║         → build-failure-log                             ║"
          echo "╚════════════════════════════════════════════════════════╝"

      # ═══════════════════════════════════════════════════════════
      # STEP 11: FIND APK
      # ═══════════════════════════════════════════════════════════
      - name: Find APK File
        if: success()
        id: find_apk
        run: |
          echo "🔍 Mencari APK..."
          find project -type f -name "*.apk" 2>/dev/null | head -20 || echo "Tidak ada"
          echo ""
          ls -la project/build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk folder tidak ada"
          echo ""

          APK_FILE=$(find project -type f -name "*.apk" | grep -v "androidTest" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ ERROR: File APK tidak ditemukan!"
            echo "=== ISI build_output.log ==="
            tail -50 project/build_output.log 2>/dev/null || echo "Log tidak ada"
            exit 1
          fi

          APK_FILE=$(echo "$APK_FILE" | sed 's|^\./||')
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $APK_FILE)" >> $GITHUB_ENV
          echo "APK_SIZE=$(du -h $APK_FILE | cut -f1)" >> $GITHUB_ENV
          echo "✅ APK found: $APK_FILE"

      # ═══════════════════════════════════════════════════════════
      # STEP 12: UPLOAD APK ARTIFACT
      # ═══════════════════════════════════════════════════════════
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-output
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      # ═══════════════════════════════════════════════════════════
      # STEP 13: BUILD SUMMARY
      # ═══════════════════════════════════════════════════════════
      - name: Build Summary
        if: success()
        run: |
          echo "✅ Build selesai!"
          echo "📱 File: ${{ env.APK_NAME }}"
          echo "📦 Size: ${{ env.APK_SIZE }}"
          echo "📍 Path: ${{ env.APK_PATH }}"