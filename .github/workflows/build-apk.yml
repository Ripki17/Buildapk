name: Build Native Android & Flutter APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type: git_url or zip_url'
        required: true
        default: 'git_url'
      source_url:
        description: 'Target Git URL or Telegram Direct ZIP Download URL'
        required: true
        default: 'https://github.com/android/architecture-samples'
      branch:
        description: 'Branch or Tag (if git_url)'
        required: false
        default: 'main'
      build_type:
        description: 'Build variant (debug or release)'
        required: true
        default: 'release'
      chat_id:
        description: 'Telegram Chat ID (optional)'
        required: false
        default: ''
      status_message_id:
        description: 'Telegram Message ID (optional)'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter version'
        required: false
        default: 'stable'
      release_tag:
        description: 'Release tag'
        required: false
        default: ''

concurrency:
  group: apk-build-${{ github.event.inputs.chat_id }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Auto-Repair APK Builder
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Build Info
        run: |
          echo "=========================================================="
          echo "        WEB2APK PRO BUILDER - GITHUB ACTIONS"
          echo "=========================================================="
          echo "Source Type  : ${{ github.event.inputs.source_type }}"
          echo "Source URL   : ${{ github.event.inputs.source_url }}"
          echo "Branch       : ${{ github.event.inputs.branch }}"
          echo "Build Type   : ${{ github.event.inputs.build_type }}"
          echo "Flutter Ver  : ${{ github.event.inputs.flutter_version }}"
          echo "Release Tag  : ${{ github.event.inputs.release_tag }}"
          echo "Chat ID      : ${{ github.event.inputs.chat_id }}"
          echo "Run ID       : ${{ github.run_id }}"
          echo "Actor        : ${{ github.actor }}"
          echo "Started at   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================================="

      - name: Download & Extract Project
        run: |
          mkdir -p project
          cd project
          SOURCE_TYPE="${{ github.event.inputs.source_type }}"
          SOURCE_URL="${{ github.event.inputs.source_url }}"

          if [ "$SOURCE_TYPE" = "zip_url" ]; then
            echo "Downloading ZIP from: $SOURCE_URL"
            curl -L -s -S --connect-timeout 30 --retry 3 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "$SOURCE_URL" -o project.zip

            FILE_HEAD=$(head -c 15 project.zip || echo "")
            if echo "$FILE_HEAD" | grep -qiE "<!doctype|<html|<error"; then
              echo "ERROR: Downloaded content is not a ZIP file!"
              head -n 20 project.zip
              exit 1
            fi

            echo "Extracting archive..."
            unzip -q project.zip 2>/dev/null || 7z x project.zip -y 2>/dev/null || tar -xf project.zip 2>/dev/null || true
            rm -f project.zip

            SUBDIRS=(*/)
            if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ] && [ ! -f "pubspec.yaml" ] && [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              echo "Flattening single root directory: ${SUBDIRS[0]}"
              mv ${SUBDIRS[0]}* . 2>/dev/null || true
              mv ${SUBDIRS[0]}.* . 2>/dev/null || true
              rmdir "${SUBDIRS[0]}" 2>/dev/null || true
            fi
          else
            echo "Cloning repository: $SOURCE_URL (branch: ${{ github.event.inputs.branch }})"
            git clone --depth 1 -b ${{ github.event.inputs.branch }} "$SOURCE_URL" .
          fi

          echo "Project root contents:"
          ls -la

      - name: Detect Framework
        working-directory: project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "FRAMEWORK=flutter" >> $GITHUB_ENV
            echo "Framework detected: FLUTTER"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -d "app" ]; then
            echo "FRAMEWORK=native-android" >> $GITHUB_ENV
            echo "Framework detected: NATIVE ANDROID"
          else
            echo "FRAMEWORK=unknown" >> $GITHUB_ENV
            echo "ERROR: Framework not detected!"
            exit 1
          fi

      - name: Setup JDK 17 and JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            11

      - name: Setup Android SDK 36
        run: |
          echo "Installing Android SDK Platform 36..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "Android SDK 36 ready"

      - name: Pre-Build Environment Patching
        working-directory: project
        run: |
          echo "Creating local.properties..."
          if [ -d "android" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          GRADLE_PROP="android/gradle.properties"
          if [ ! -d "android" ]; then
            GRADLE_PROP="gradle.properties"
          fi

          touch "$GRADLE_PROP"
          grep -q "org.gradle.jvmargs" "$GRADLE_PROP" || printf '\n%s\n' 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> "$GRADLE_PROP"
          grep -q "android.useAndroidX" "$GRADLE_PROP" || printf '\n%s\n' 'android.useAndroidX=true' >> "$GRADLE_PROP"
          grep -q "android.enableJetifier" "$GRADLE_PROP" || printf '\n%s\n' 'android.enableJetifier=true' >> "$GRADLE_PROP"
          grep -q "android.newDsl" "$GRADLE_PROP" || printf '\n%s\n' 'android.newDsl=false' >> "$GRADLE_PROP"

          [ -f "./gradlew" ] && chmod +x ./gradlew
          [ -f "android/gradlew" ] && chmod +x android/gradlew

      - name: Setup Flutter
        if: env.FRAMEWORK == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_version || 'stable' }}
          cache: true

      - name: Show Flutter Version
        if: env.FRAMEWORK == 'flutter'
        run: |
          flutter --version

      # ═══════════════════════════════════════════════════════════
      # FIX UTAMA: PATCH PUBSPEC & SDK VERSIONS
      # ═══════════════════════════════════════════════════════════
      - name: Pre-Fix Dependencies & SDK Versions
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          echo "=========================================================="
          echo "   PRE-FIX: Dependencies & SDK Versions"
          echo "=========================================================="

          # ── FIX 1: font_awesome_flutter compatibility ──
          echo ""
          echo "[Fix 1] Checking font_awesome_flutter..."
          if [ -f "pubspec.yaml" ]; then
            CURRENT_FA=$(grep -E "^\s*font_awesome_flutter:" pubspec.yaml | head -1 || echo "")
            echo "Current: $CURRENT_FA"

            if echo "$CURRENT_FA" | grep -qE "font_awesome_flutter"; then
              echo "Upgrading font_awesome_flutter to ^11.0.0..."
              sed -i 's/font_awesome_flutter: .*/font_awesome_flutter: ^11.0.0/g' pubspec.yaml
              echo "Updated:"
              grep -E "font_awesome_flutter" pubspec.yaml
            fi
          fi

          # ── FIX 2: Gradle wrapper 8.14 ──
          echo ""
          echo "[Fix 2] Upgrading Gradle wrapper..."
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.14-all.zip|g' "$WRAPPER"
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.14-bin.zip|g' "$WRAPPER"
            echo "Gradle wrapper updated:"
            cat "$WRAPPER"
          else
            mkdir -p android/gradle/wrapper
            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip' \
              'networkTimeout=10000' \
              'validateDistributionUrl=true' \
              > "$WRAPPER"
          fi

          # ── FIX 3: compileSdk 36 & targetSdk 36 ──
          echo ""
          echo "[Fix 3] Setting compileSdk/targetSdk to 36..."
          APP_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_KTS" ]; then
            echo "Patching build.gradle.kts..."
            sed -i 's/compileSdk *= *[0-9]*/compileSdk = 36/g' "$APP_KTS" || true
            sed -i 's/targetSdk *= *[0-9]*/targetSdk = 36/g' "$APP_KTS" || true
            sed -i 's/minSdk *= *[0-9]*/minSdk = 21/g' "$APP_KTS" || true
            grep -E "Sdk" "$APP_KTS" || true
          fi

          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            echo "Patching build.gradle..."
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' "$APP_GRADLE" || true
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' "$APP_GRADLE" || true
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' "$APP_GRADLE" || true
            grep -E "SdkVersion" "$APP_GRADLE" || true
          fi

          # ── FIX 4: Clean old build cache ──
          echo ""
          echo "[Fix 4] Cleaning build artifacts..."
          rm -rf build android/build android/app/build android/.gradle .gradle pubspec.lock .dart_tool || true
          echo "Cleaned"

          echo ""
          echo "=========================================================="
          echo "   PRE-FIX COMPLETE"
          echo "=========================================================="

      - name: Build Flutter APK
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "=== STEP 1: flutter pub get ==="
          flutter clean || true
          flutter pub get 2>&1 | tee pubget.log
          PUBGET_EXIT=$?

          if [ $PUBGET_EXIT -ne 0 ]; then
            echo "=== pub get failed, retrying with clean cache ==="
            rm -f pubspec.lock
            flutter pub cache repair || true
            flutter pub get 2>&1 | tee pubget_retry.log
          fi

          BUILD_FLAG="--release"
          [ "${{ github.event.inputs.build_type }}" = "debug" ] && BUILD_FLAG="--debug"

          echo ""
          echo "=== STEP 2: flutter build apk $BUILD_FLAG ==="
          set +e
          flutter build apk $BUILD_FLAG --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "=== BUILD EXIT CODE: $BUILD_EXIT ==="

          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED - FULL ERROR LOG ==="
            echo "============================================"
            cat build_output.log
            echo "============================================"

            echo ""
            echo "=== CHECKING KNOWN ERRORS ==="

            # Error: IconData final class (font_awesome)
            if grep -q "IconData.*final class" build_output.log; then
              echo "[KNOWN ERROR] font_awesome_flutter incompatible!"
              echo "Attempting: force cache clean + reinstall..."
              flutter pub cache repair || true
              rm -rf ~/.pub-cache/hosted/pub.dev/font_awesome_flutter-* 2>/dev/null || true
              flutter pub get || true

              echo "Rebuilding..."
              set +e
              flutter build apk $BUILD_FLAG --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_output_retry.log
              RETRY_EXIT=${PIPESTATUS[0]}
              set -e

              if [ $RETRY_EXIT -eq 0 ]; then
                echo "Build succeeded on retry!"
                exit 0
              fi
            fi

            # Error: Groovy
            if grep -qE "Could not initialize class org.codehaus.groovy" build_output.log; then
              echo "[KNOWN ERROR] Groovy/Java compat!"
              export JAVA_HOME="$JAVA_HOME_11_X64"
              export PATH="$JAVA_HOME/bin:$PATH"
            fi

            # Error: Gradle version
            if grep -qE "Gradle version.*lower than|minimum supported version" build_output.log; then
              echo "[KNOWN ERROR] Gradle version mismatch!"
              sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.14-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
              sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.14-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            fi

            echo ""
            echo "=== RETRY BUILD ==="
            set +e
            flutter build apk $BUILD_FLAG --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_output_retry.log
            RETRY_EXIT=${PIPESTATUS[0]}
            set -e

            echo ""
            echo "=== RETRY EXIT CODE: $RETRY_EXIT ==="

            if [ $RETRY_EXIT -ne 0 ]; then
              echo ""
              echo "##############################################"
              echo "#          FLUTTER BUILD FAILED              #"
              echo "##############################################"
              echo ""
              echo "===== LAST 60 LINES (retry) ====="
              tail -60 build_output_retry.log
              echo ""
              echo "===== ERROR KEYWORDS ====="
              grep -E "Error:|error:|FAILURE|Could not|BUILD FAILED|Exception" build_output_retry.log | head -40 || true
              echo ""
              echo "##############################################"
              exit 1
            fi
          fi

          echo ""
          echo "=== FLUTTER BUILD SUCCESSFUL! ==="

      - name: Build Native Android APK
        if: env.FRAMEWORK == 'native-android'
        working-directory: project
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_URL=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties || echo "")
            if echo "$GRADLE_URL" | grep -qE "gradle-([456]\.|7\.[0-2])"; then
              export JAVA_HOME="$JAVA_HOME_11_X64"
            else
              export JAVA_HOME="$JAVA_HOME_17_X64"
            fi
          else
            export JAVA_HOME="$JAVA_HOME_17_X64"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          [ ! -f "./gradlew" ] && { gradle wrapper || true; chmod +x ./gradlew || true; }

          BUILD_CMD="./gradlew assembleRelease --no-daemon --stacktrace"
          [ "${{ github.event.inputs.build_type }}" = "debug" ] && BUILD_CMD="./gradlew assembleDebug --no-daemon --stacktrace"

          set +e
          $BUILD_CMD 2>&1 | tee build_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "=== GRADLE EXIT CODE: $EXIT_CODE ==="

          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FULL ERROR LOG ==="
            cat build_output.log
            echo "=== RETRYING ==="
            if grep -q "Could not initialize class org.codehaus.groovy" build_output.log; then
              export JAVA_HOME="$JAVA_HOME_11_X64"
              export PATH="$JAVA_HOME/bin:$PATH"
            fi
            if grep -q "Namespace not specified" build_output.log; then
              sed -i '/android {/a \    namespace "com.telebuild.repaired.app"' app/build.gradle 2>/dev/null || true
            fi
            if grep -q "Could not resolve all files" build_output.log; then
              sed -i '/repositories {/a \        google()\n        mavenCentral()\n        maven { url "https://jitpack.io" }' build.gradle 2>/dev/null || true
            fi
            set +e
            $BUILD_CMD 2>&1 | tee build_output_retry.log
            RETRY_EXIT=${PIPESTATUS[0]}
            set -e
            if [ $RETRY_EXIT -ne 0 ]; then
              echo "=== GRADLE FAILED AFTER RETRY ==="
              tail -60 build_output_retry.log
              exit 1
            fi
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            project/build_output.log
            project/build_output_retry.log
            project/pubget.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Find APK
        if: success()
        id: find_apk
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" 2>/dev/null | head -20 || echo "No APK found"

          APK_FILE=$(find project -type f -name "*.apk" | grep -v "androidTest" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found!"
            tail -50 project/build_output.log 2>/dev/null || true
            exit 1
          fi

          APK_FILE=$(echo "$APK_FILE" | sed 's|^\./||')
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA=$(sha256sum "$APK_FILE" | cut -d ' ' -f1)

          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $APK_FILE)" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "APK_SHA=$APK_SHA" >> $GITHUB_ENV

          echo "APK found: $APK_FILE ($APK_SIZE)"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-output
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: Final Summary
        if: always()
        run: |
          echo ""
          echo "##############################################"
          if [ "${{ job.status }}" = "success" ]; then
            echo "#          BUILD SUCCESSFUL                 #"
            echo "##############################################"
            echo "File    : ${{ env.APK_NAME }}"
            echo "Size    : ${{ env.APK_SIZE }}"
            echo "SHA-256 : ${{ env.APK_SHA }}"
          else
            echo "#          BUILD FAILED                     #"
            echo "##############################################"
            echo "Check logs above for error details"
            echo "Download 'build-failure-log' artifact for full log"
          fi
          echo "##############################################"

      - name: Job Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "# ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| File | \`${{ env.APK_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Size | \`${{ env.APK_SIZE }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| SHA-256 | \`${{ env.APK_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "# ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check logs above for details." >> $GITHUB_STEP_SUMMARY
          fi