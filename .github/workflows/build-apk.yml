name: Build Native Android & Flutter APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type: git_url or zip_url'
        required: true
        default: 'git_url'
      source_url:
        description: 'Target Git URL or Telegram Direct ZIP Download URL'
        required: true
        default: 'https://github.com/android/architecture-samples'
      branch:
        description: 'Branch or Tag (if git_url)'
        required: false
        default: 'main'
      build_type:
        description: 'Build variant (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      chat_id:
        description: 'Telegram Chat ID to send APK & live logs to'
        required: true
      status_message_id:
        description: 'Telegram Message ID to update live log preview'
        required: false
        default: ''

jobs:
  build-apk:
    name: Auto Detect & Compile APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Function to update Live Log in Telegram
        run: |
          cat << 'EOF' > update_tg_log.sh
          #!/usr/bin/env bash
          BOT_TOKEN="$1"
          CHAT_ID="$2"
          MSG_ID="$3"
          LOG_TEXT="$4"
          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            ENCODED_TEXT=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$LOG_TEXT")
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \\
              -d "chat_id=$CHAT_ID" \\
              -d "message_id=$MSG_ID" \\
              -d "parse_mode=Markdown" \\
              -d "text=$ENCODED_TEXT" > /dev/null || true
          fi
          EOF
          chmod +x update_tg_log.sh

      - name: Setup Project Directory & Unpack Source
        id: setup_source
        run: |
          mkdir -p project
          cd project
          SOURCE_TYPE="${{ github.event.inputs.source_type }}"
          SOURCE_URL="${{ github.event.inputs.source_url }}"

          if [ "$SOURCE_TYPE" = "zip_url" ]; then
            echo "Mengunduh Project ZIP..."
            curl -L "$SOURCE_URL" -o project_upload.zip
            unzip -q project_upload.zip || 7z x project_upload.zip
            rm -f project_upload.zip

            SUBDIRS=(*/)
            if [ ${#SUBDIRS[@]} -eq 1 ] && [ -d "${SUBDIRS[0]}" ] && [ ! -f "pubspec.yaml" ] && [ ! -f "build.gradle" ]; then
              echo "Flattening nested single root folder: ${SUBDIRS[0]}"
              mv ${SUBDIRS[0]}* . 2>/dev/null || true
              mv ${SUBDIRS[0]}.* . 2>/dev/null || true
            fi
          else
            echo "Cloning Git repository: $SOURCE_URL..."
            git clone --depth 1 -b ${{ github.event.inputs.branch }} "$SOURCE_URL" .
          fi
          echo "Direktori project siap:"
          ls -la

      - name: Auto-Detect Project Framework (Flutter vs Native Android)
        id: detect_framework
        working-directory: project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "FRAMEWORK=flutter" >> $GITHUB_ENV
            echo "framework=flutter" >> $GITHUB_OUTPUT
            APP_NAME=$(grep "^name:" pubspec.yaml | head -n 1 | awk '{print $2}')
            echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
            echo "Detected: Flutter App ($APP_NAME)"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "FRAMEWORK=native-android" >> $GITHUB_ENV
            echo "framework=native-android" >> $GITHUB_OUTPUT
            echo "Detected: Native Android (Gradle / Kotlin / Java)"
          else
            echo "FRAMEWORK=unknown" >> $GITHUB_ENV
            echo "framework=unknown" >> $GITHUB_OUTPUT
            echo "ERROR: Format project tidak dikenali. Wajib memuat pubspec.yaml atau build.gradle!"
            exit 1
          fi

      - name: Send Live Log: Framework Detected
        run: |
          ./update_tg_log.sh "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ github.event.inputs.chat_id }}" "${{ github.event.inputs.status_message_id }}" "🔍 *Framework Terdeteksi:* `${{ env.FRAMEWORK }}`%0A⚙️ *Mode:* `${{ github.event.inputs.build_type }}`%0A⏳ *Status:* Menyiapkan toolchain dan SDK..."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter Environment (if Flutter)
        if: env.FRAMEWORK == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Send Live Log: Dependencies & Pre-build
        run: |
          ./update_tg_log.sh "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ github.event.inputs.chat_id }}" "${{ github.event.inputs.status_message_id }}" "⚡ *Tahap 2: Menyiapkan Dependencies...*%0AFramework: `${{ env.FRAMEWORK }}`%0A💻 Menjalankan resolusi paket & library..."

      - name: Build Flutter APK
        if: env.FRAMEWORK == 'flutter'
        working-directory: project
        run: |
          echo "Menjalankan flutter pub get..."
          flutter pub get
          BUILD_FLAG="--release"
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            BUILD_FLAG="--debug"
          fi
          echo "Menjalankan flutter build apk $BUILD_FLAG..."
          flutter build apk $BUILD_FLAG --no-tree-shake-icons

      - name: Build Native Android APK
        if: env.FRAMEWORK == 'native-android'
        working-directory: project
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assemble
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate Generated APK & Calculate Hash
        id: find_apk
        working-directory: project
        run: |
          APK_FILE=$(find . -type f -name "*.apk" | grep -v "androidTest" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: File APK tidak ditemukan!"
            exit 1
          fi
          FILE_SIZE=$(du -h "$APK_FILE" | cut -f1)
          SHA_HASH=$(sha256sum "$APK_FILE" | cut -d ' ' -f 1)
          FILE_NAME=$(basename "$APK_FILE")
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA_HASH" >> $GITHUB_OUTPUT

      - name: Send Live Log: Uploading Final APK
        run: |
          ./update_tg_log.sh "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ github.event.inputs.chat_id }}" "${{ github.event.inputs.status_message_id }}" "🚀 *Kompilasi Sukses!*%0A📦 File: `${{ steps.find_apk.outputs.apk_name }}` (${{ steps.find_apk.outputs.file_size }})%0A📤 Sedang mengunggah APK langsung ke chat ini..."

      - name: Upload APK Directly to Telegram Chat
        working-directory: project
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          FILE_NAME="${{ steps.find_apk.outputs.apk_name }}"
          FILE_SIZE="${{ steps.find_apk.outputs.file_size }}"
          SHA_HASH="${{ steps.find_apk.outputs.sha256 }}"
          FRAMEWORK="${{ env.FRAMEWORK }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          CAPTION="✅ *Kompilasi APK Selesai!*%0A%0A📱 *File:* \`$FILE_NAME\`%0A🛠 *Framework:* \`$FRAMEWORK\`%0A📊 *Ukuran:* $FILE_SIZE%0A🔐 *SHA-256:*%0A\`$SHA_HASH\`%0A%0A⚡ _Dikompilasi 24/7 otomatis via TeleBuild Engine_"
          curl -F "chat_id=$CHAT_ID" \\
               -F "document=@$APK_PATH" \\
               -F "caption=$CAPTION" \\
               -F "parse_mode=Markdown" \\
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"

      - name: Send Error Log (if failed)
        if: failure()
        run: |
          ./update_tg_log.sh "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ github.event.inputs.chat_id }}" "${{ github.event.inputs.status_message_id }}" "❌ *Build APK Gagal!*%0A%0APeriksa file log di GitHub Actions runner atau pastikan file ZIP/Repo memiliki konfigurasi Gradle/Flutter yang valid."
