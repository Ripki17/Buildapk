name: Build Native Android & Flutter APK

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Source project type"
        required: true
        type: choice
        options:
          - git_url
          - zip_url
        default: git_url

      source_url:
        description: "Git repository URL or direct ZIP download URL"
        required: true
        type: string

      branch:
        description: "Git branch (ignored for ZIP)"
        required: false
        default: main
        type: string

      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

      chat_id:
        description: "Optional Telegram chat ID"
        required: false
        type: string

      status_message_id:
        description: "Optional Telegram status message ID"
        required: false
        type: string

      flutter_version:
        description: "Flutter SDK version"
        required: true
        default: "3.47.7"
        type: string

      release_tag:
        description: "Optional GitHub release tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      SOURCE_TYPE: ${{ inputs.source_type }}
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_BRANCH: ${{ inputs.branch }}
      BUILD_TYPE: ${{ inputs.build_type }}
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
      TELEGRAM_STATUS_MESSAGE_ID: ${{ inputs.status_message_id }}

    steps:
      # --------------------------------------------------
      # 1. Checkout workflow repository
      # --------------------------------------------------
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install system dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            zip \
            git \
            file \
            python3 \
            python3-pip

      # --------------------------------------------------
      # 3. Validate input
      # --------------------------------------------------
      - name: Validate source URL
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SOURCE_URL" ]; then
            echo "::error::Source URL is empty."
            exit 1
          fi

          case "$SOURCE_TYPE" in
            git_url|zip_url)
              ;;
            *)
              echo "::error::Unsupported source type: $SOURCE_TYPE"
              exit 1
              ;;
          esac

          case "$BUILD_TYPE" in
            release|debug)
              ;;
            *)
              echo "::error::Unsupported build type: $BUILD_TYPE"
              exit 1
              ;;
          esac

          echo "Source type: $SOURCE_TYPE"
          echo "Build type: $BUILD_TYPE"

      # --------------------------------------------------
      # 4. Download project
      # --------------------------------------------------
      - name: Download source project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project source.zip
          mkdir -p project

          if [ "$SOURCE_TYPE" = "git_url" ]; then
            if [ -z "$SOURCE_BRANCH" ]; then
              SOURCE_BRANCH="main"
            fi

            git clone \
              --depth 1 \
              --single-branch \
              --branch "$SOURCE_BRANCH" \
              "$SOURCE_URL" \
              project

          elif [ "$SOURCE_TYPE" = "zip_url" ]; then
            curl \
              --fail \
              --location \
              --retry 3 \
              --connect-timeout 30 \
              --max-time 600 \
              "$SOURCE_URL" \
              --output source.zip

            if ! unzip -tq source.zip; then
              echo "::error::Downloaded file is not a valid ZIP archive."
              exit 1
            fi

            unzip -q source.zip -d project

            # Flatten a single wrapper directory if necessary.
            if [ ! -f project/pubspec.yaml ] \
              && [ ! -f project/settings.gradle ] \
              && [ ! -f project/settings.gradle.kts ] \
              && [ ! -f project/gradlew ]; then

              mapfile -t ROOT_ENTRIES < <(
                find project -mindepth 1 -maxdepth 1
              )

              if [ "${#ROOT_ENTRIES[@]}" -eq 1 ] \
                && [ -d "${ROOT_ENTRIES[0]}" ]; then

                INNER="${ROOT_ENTRIES[0]}"
                shopt -s dotglob nullglob

                if [ -n "$(find "$INNER" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                  mv "$INNER"/* project/
                fi

                rmdir "$INNER" 2>/dev/null || true
              fi
            fi
          fi

          echo "===== Downloaded project ====="
          find project -maxdepth 2 -type f \
            | head -100

      # --------------------------------------------------
      # 5. Detect project root and framework
      # --------------------------------------------------
      - name: Detect framework and project root
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          ROOT=""

          # Find a project root, including ZIPs with nested folders.
          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/pubspec.yaml" ]; then
              ROOT="$DIR"
              break
            fi
          done < <(
            find project -maxdepth 5 -type f \
              \( -name pubspec.yaml -o -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -print0
          )

          if [ -z "$ROOT" ]; then
            echo "::error::Could not find a Flutter or Android Gradle project."
            exit 1
          fi

          ROOT="$(realpath "$ROOT")"

          if [ -f "$ROOT/pubspec.yaml" ]; then
            FRAMEWORK="flutter"
          elif [ -f "$ROOT/settings.gradle" ] \
            || [ -f "$ROOT/settings.gradle.kts" ]; then
            FRAMEWORK="native"
          else
            echo "::error::Unsupported project layout: $ROOT"
            exit 1
          fi

          echo "Project root: $ROOT"
          echo "Framework: $FRAMEWORK"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"

          echo "framework=$FRAMEWORK" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 6. Set up Java
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 7. Set up Flutter when needed
      # --------------------------------------------------
      - name: Set up Flutter
        if: env.FRAMEWORK == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      # --------------------------------------------------
      # 8. Repair minimum SDK configuration
      # --------------------------------------------------
      - name: Repair Android minSdk configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          minimum = 24

          skip = {
              ".git", ".gradle", "build",
              ".dart_tool", "node_modules"
          }

          files = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if any(part in skip for part in path.parts):
                  continue

              name = path.name

              if name in {
                  "build.gradle",
                  "build.gradle.kts",
                  "libs.versions.toml",
                  "AndroidManifest.xml",
              }:
                  files.append(path)

          changed = []

          for path in files:
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original

              if path.name in {"build.gradle", "build.gradle.kts"}:
                  # Repair literal declarations such as:
                  # minSdk 23
                  # minSdk = 23
                  # minSdkVersion 23
                  # minSdkVersion = 23
                  pattern = re.compile(
                      r'(\bminSdk(?:Version)?\s*'
                      r'(?:=\s*)?)(\d+)\b'
                  )

                  def fix_min_sdk(match):
                      value = int(match.group(2))

                      if value < minimum:
                          return match.group(1) + str(minimum)

                      return match.group(0)

                  updated = pattern.sub(fix_min_sdk, updated)

              elif path.name == "libs.versions.toml":
                  # Repair quoted SDK version catalog entries:
                  # minSdk = "23"
                  pattern = re.compile(
                      r'(?m)^(\s*minSdk\s*=\s*["\'])(\d+)(["\'])'
                  )

                  def fix_catalog(match):
                      value = int(match.group(2))

                      if value < minimum:
                          return match.group(1) + str(minimum) + match.group(3)

                      return match.group(0)

                  updated = pattern.sub(fix_catalog, updated)

              elif path.name == "AndroidManifest.xml":
                  # Manifest SDK declarations should normally be managed
                  # by Gradle. Raise any explicit numeric declaration.
                  pattern = re.compile(
                      r'(android:minSdkVersion\s*=\s*["\'])(\d+)(["\'])'
                  )

                  def fix_manifest(match):
                      value = int(match.group(2))

                      if value < minimum:
                          return match.group(1) + str(minimum) + match.group(3)

                      return match.group(0)

                  updated = pattern.sub(fix_manifest, updated)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path.relative_to(root)))

          print("Minimum Android SDK requirement:", minimum)

          if changed:
              print("Updated configuration files:")
              for name in changed:
                  print(" -", name)
          else:
              print(
                  "No literal minSdk below 24 was found. "
                  "Dynamic Gradle expressions may need manual review."
              )
          PY

      # --------------------------------------------------
      # 9. Flutter Android compatibility patch
      # --------------------------------------------------
      - name: Configure Flutter Android SDK
        if: env.FRAMEWORK == 'flutter'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("android/app")
          candidates = [
              root / "build.gradle",
              root / "build.gradle.kts",
          ]

          gradle = next((p for p in candidates if p.is_file()), None)

          if gradle is None:
              raise SystemExit(
                  "Flutter Android app Gradle file was not found."
              )

          text = gradle.read_text(encoding="utf-8")

          # Handle common Groovy and Kotlin DSL forms.
          pattern = re.compile(
              r'(\bminSdk(?:Version)?\s*(?:=\s*)?)(\d+)\b'
          )

          text = pattern.sub(
              lambda m: m.group(1) + str(max(24, int(m.group(2)))),
              text
          )

          gradle.write_text(text, encoding="utf-8")

          print("Flutter Gradle file:", gradle)
          print("Minimum SDK requirement: 24")
          PY

      # --------------------------------------------------
      # 10. Diagnose SDK and Gradle configuration
      # --------------------------------------------------
      - name: Diagnose Android configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo "===== Framework ====="
          echo "$FRAMEWORK"

          echo "===== Project root ====="
          pwd

          echo "===== Gradle files ====="
          find . -maxdepth 5 -type f \
            \( -name build.gradle \
               -o -name build.gradle.kts \
               -o -name libs.versions.toml \
               -o -name AndroidManifest.xml \) \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print

          echo "===== SDK declarations ====="
          grep -R -n -E 'minSdk|uses-sdk' . \
            --include=build.gradle \
            --include=build.gradle.kts \
            --include=libs.versions.toml \
            --include=AndroidManifest.xml \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.git || true

      # --------------------------------------------------
      # 11. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        if: env.FRAMEWORK == 'native'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew

            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              echo "::error::gradle-wrapper.jar is missing."
              echo "Restore the project's Gradle wrapper files."
              exit 1
            fi
          else
            echo "Gradle wrapper not found; installing Gradle 8.14.3."

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.14.3-bin.zip \
              -o /tmp/gradle.zip

            sudo unzip -q /tmp/gradle.zip -d /opt

            echo "/opt/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          fi

      # --------------------------------------------------
      # 12. Build Native Android
      # --------------------------------------------------
      - name: Build Native Android APK
        if: env.FRAMEWORK == 'native'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -x ./gradlew ]; then
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          if [ "$BUILD_TYPE" = "release" ]; then
            TASK="assembleRelease"
          else
            TASK="assembleDebug"
          fi

          echo "Running Gradle task: $TASK"

          $GRADLE \
            --no-daemon \
            --stacktrace \
            "$TASK"

      # --------------------------------------------------
      # 13. Build Flutter APK
      # --------------------------------------------------
      - name: Build Flutter APK
        if: env.FRAMEWORK == 'flutter'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v
          flutter pub get

          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk \
              --release \
              --no-pub
          else
            flutter build apk \
              --debug \
              --no-pub
          fi

      # --------------------------------------------------
      # 14. Collect APK files
      # --------------------------------------------------
      - name: Collect APK artifacts
        id: collect
        if: success()
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          if [ "$FRAMEWORK" = "flutter" ]; then
            APK_DIR="build/app/outputs/flutter-apk"
          else
            APK_DIR="app/build/outputs/apk"
          fi

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found: $APK_DIR"
            find . -type f -name '*.apk' -print
            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" -type f -name '*.apk' | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK files were generated."
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            NAME="$(basename "$APK")"
            cp "$APK" "$GITHUB_WORKSPACE/output/$NAME"
            echo "Collected: $NAME"
          done

          echo "APK_COUNT=${#APKS[@]}" >> "$GITHUB_OUTPUT"

          echo "===== Final APK files ====="
          ls -lh "$GITHUB_WORKSPACE/output"

      # --------------------------------------------------
      # 15. Upload APK artifacts
      # --------------------------------------------------
      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FRAMEWORK }}-${{ env.BUILD_TYPE }}-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 16. Optional GitHub release
      # --------------------------------------------------
      - name: Publish GitHub release
        if: success() && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: APK Build ${{ inputs.release_tag }}
          files: output/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      # --------------------------------------------------
      # 17. Optional Telegram status notification
      # --------------------------------------------------
      - name: Notify Telegram
        if: always() && inputs.chat_id != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE_ID: ${{ inputs.status_message_id }}
          JOB_STATUS: ${{ job.status }}
          FRAMEWORK_NAME: ${{ env.FRAMEWORK }}
          BUILD_KIND: ${{ inputs.build_type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN secret not configured; skipping notification."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          message_id = os.environ.get("MESSAGE_ID", "").strip()
          status = os.environ.get("JOB_STATUS", "unknown")
          framework = os.environ.get("FRAMEWORK_NAME") or "unknown"
          build_type = os.environ.get("BUILD_KIND", "release")
          run_url = os.environ.get("RUN_URL", "")

          emoji = "✅" if status == "success" else "❌"

          text = (
              f"{emoji} APK Build: {status.upper()}\n"
              f"Framework: {framework}\n"
              f"Build: {build_type}\n"
              f"Run: {run_url}"
          )

          if message_id:
              method = "editMessageText"
              data = {
                  "chat_id": chat_id,
                  "message_id": int(message_id),
                  "text": text,
              }
          else:
              method = "sendMessage"
              data = {
                  "chat_id": chat_id,
                  "text": text,
              }

          url = f"https://api.telegram.org/bot{token}/{method}"
          request = urllib.request.Request(
              url,
              data=urllib.parse.urlencode(data).encode(),
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(response.read().decode())
          except Exception as error:
              # A notification failure should not hide the build result.
              print(f"Telegram notification failed: {error}")
          PY

      # --------------------------------------------------
      # 18. Print diagnostics on failure
      # --------------------------------------------------
      - name: Failure diagnostics
        if: failure()
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo "===== BUILD FAILED ====="
          echo "Framework: ${FRAMEWORK:-unknown}"
          echo "Build type: ${BUILD_TYPE:-unknown}"
          echo "Project root: ${PROJECT_ROOT:-unknown}"

          echo "===== Relevant Gradle configuration ====="

          grep -R -n -E 'minSdk|uses-sdk|firebase-auth' . \
            --include=build.gradle \
            --include=build.gradle.kts \
            --include=libs.versions.toml \
            --include=AndroidManifest.xml \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.git || true

          echo "===== APK files, if any ====="
          find . -type f -name '*.apk' \
            -not -path '*/.gradle/*' -print || true